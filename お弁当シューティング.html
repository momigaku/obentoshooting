<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お弁当シューティング</title>
<style>
:root{--bg:#fff3dc;--fg:#4a2f17;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1611;--fg:#f4e3c9}}
:root[data-theme="dark"]{--bg:#1d1611;--fg:#f4e3c9}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
canvas{width:100%;max-width:960px;aspect-ratio:16/9;touch-action:none;display:block}
p{font-size:13px;margin:8px;opacity:.8;text-align:center}
#pad{display:flex;align-items:center;gap:28px;margin:8px 0 2px;user-select:none;-webkit-user-select:none}
.dp{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,62px);gap:6px}
#pad button{font-size:24px;border:0;border-radius:14px;background:#e8b86b;color:#4a2f17;touch-action:none;box-shadow:0 3px #b8873c;padding:0}
#pad button:active{transform:translateY(2px)}
.dp .u{grid-column:2;grid-row:1}.dp .l{grid-column:1;grid-row:2}.dp .d{grid-column:2;grid-row:2}.dp .r{grid-column:3;grid-row:2}
#pad .ok{width:80px;height:62px;font-size:16px}
#pad .big{width:120px;height:84px;font-size:18px;white-space:nowrap}#pad .sm{width:120px;height:40px}

#pad .ok.rdy{animation:bl .4s infinite alternate;box-shadow:0 0 16px 5px #ffe066}@keyframes bl{from{background:#ffd23a}to{background:#fff6b0}}

</style></head><body>
<canvas id="c" width="800" height="450"></canvas>
<div id="pad"><div class="dp"><button class="u" data-k="ArrowUp">▲</button><button class="l" data-k="ArrowLeft">◀</button><button class="d" data-k="ArrowDown">▼</button><button class="r" data-k="ArrowRight">▶</button></div><div style="display:flex;flex-direction:column;gap:6px"><button class="ok big" data-k="big">スマッシュ</button><button class="ok sm" data-k="ok">OK</button></div></div>
<p>矢印キー／マウス・タッチ／下のボタンで移動（弾は自動連射）</p>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=800,H=450,LEN=140,LN=()=>stage==4?200:LEN;
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],cl=(v,a,b)=>Math.max(a,Math.min(b,v)),hit=(a,b,r)=>(a.x-b.x)**2+(a.y-b.y)**2<r*r;
const S=[
{en:['🍦','🐛','🐍'],k:'wiener',n:'タコさんウインナー'},
{en:['🍜','🦀','🐈'],k:'tamago',n:'卵焼き'},
{en:['🍲','🐘','🦂'],k:'meat',n:'ミートボール'},
{en:['🍧','🐊','🕷️'],k:'tomato',n:'ミニトマトとブロッコリー'},
{en:['🦈','🐻','🍨'],k:'karaage',n:'唐揚げ'}];
S[0].en.push('🦟','🐝');S[1].en.push('🦇','🦆');S[2].en.push('🐌','🦉');S[3].en.push('🪳','🐡');S[4].en.push('🦅','🐺');
const G=[['🐸','🐇','🦔'],['🦘','🐕','🐿️'],['🐓','🦌','🐗'],['🐀','🦎','🐢'],['🦖','🐖','🐊']];
S[0].en=['🦟','🐝','🦋','🐞','🪰','🕷️'];G[0]=['🦗','🐜','🪲','🐛'];
S[1].en=['🦅','🦇','🦉','🐈','🐺','🐒'];G[1]=['🐘','🦏','🐻','🐗','🦘','🦌'];
S[2].en=['🗿','🏺','🦕','🦴','🖼️','⚱️','🏛️'];G[2]=['🦖','🗿','🏺','🦕','🦴'];
S[3].en=['⚙️','🔧','🔩','🤖','🏭','🧪','🛢️','⛓️'];G[3]=['🤖','🚜','🛢️','📦','🧰'];
S[4].en=['👽','🛸','🚀','☄️','🛰️','🪐','🌑','👾'];G[4]=['👾','👽','🦠','🌑'];
let mwd=0,Q={rl:1,wr:0,big:0},yl=0,mb=null,mbd=0,st='title',stage=0,allies=[],keys={},mx=null,my=0,t=0,ct=0,score=0,P,B=[],E=[],EB=[],IT=[],FX=[],boss=null,stT=0,sp=1,msg='',msgT=0;

function spawn(){
 const z=Math.random()<.5?1:Math.random()<.6?0:2;
 const Z=[{r:18,f:34,h:.6,sp:1.3,sh:2.4,pt:60},{r:27,f:46,h:1,sp:1,sh:3,pt:100},{r:42,f:70,h:3,sp:.7,sh:1.8,pt:300}][z];
 const g=Math.random()<.22,m=g?3:pick([0,1,2,4,5,1,4]),gy=H-22-Z.r*.5,y=g?gy:rnd(40+Z.r,H-40-Z.r);
 E.push({x:W+40,y,y0:y,gy,hp:Math.max(1,Math.round((2+stage+(stT/50|0))*Z.h)),r:Z.r,f:Z.f,z,sp:Z.sp,e:pick(g?G[stage]:S[stage].en),m,t:0,sh:rnd(1,2.5),sc:Z.sh,pt:Z.pt,vy:0})}
function init(){P={x:110,y:H/2,hp:3,inv:0,tri:0,bar:0,fc:0,oc:0,fv:0,rl:Q.rl,wr:Q.wr,big:Q.big,bt:0};B=[];E=[];EB=[];IT=[];FX=[];boss=null;mb=null;mbd=0;mwd=0;yl=25;stT=0;sp=1;msg='STAGE '+(stage+1);msgT=2.5;st='play'}
function boom(x,y,n,c){for(let i=0;i<n;i++){const a=rnd(0,6.3),v=rnd(40,260);FX.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.4,1),c})}}
function hurt(){if(P.inv>0||P.fv>0)return;if(P.bar>0){P.bar--;P.inv=.6;boom(P.x,P.y,10,'#7fe');return}
 P.hp--;P.inv=1.8;boom(P.x,P.y,16,'#f55');if(P.hp<=0){st='over';ct=0;boom(P.x,P.y,40,'#fa3')}}
function shoot(){const n=P.fv>0?5:P.rl,sz=1+(n-1)*.22;for(const g of P.tri>0||P.fv>0?[-.28,0,.28]:[0])for(let j=0;j<n;j++)B.push({x:P.x+34,y:P.y+(j-(n-1)/2)*(9+n),vx:Math.cos(g)*640,vy:Math.sin(g)*640,s:sz});
 allies.forEach((k,i)=>B.push({x:P.x+20,y:P.y+(i%2?1:-1)*(8+i*2),vx:640,vy:0}))}
function aim(x,y,v){const a=Math.atan2(P.y-y,P.x-x);EB.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v})}

function step(dt){
 t+=dt;for(const f of FX){f.x+=f.vx*dt;f.y+=f.vy*dt;f.l-=dt}FX=FX.filter(f=>f.l>0);

 stT+=dt;msgT-=dt;yl-=dt;P.bt-=dt;Q.rl=P.rl;Q.wr=P.wr;Q.big=P.big;

 P.x=cl(P.x,45,W-45);if(P.y<40||P.y>H-40){if(P.fv>0)P.y=cl(P.y,40,H-40);else{P.hp=0;st='over';ct=0;boom(P.x,P.y,40,'#fa3')}}P.inv-=dt;if(P.fv>0)P.fv-=dt;else P.tri-=dt;

  }}
 for(const e of E){e.t+=dt;const v=(110+stage*18)*e.sp;
  if(e.m==5){if(e.x>W-170)e.x-=v*1.6*dt;else if(e.t>6)e.x-=v*2*dt}
  else if(e.m==4){if(e.x>W*.55)e.x-=v*dt;else{e.x-=v*.35*dt;e.zz=e.zz||1;e.y+=e.zz*260*dt;if(e.y<50||e.y>H-50)e.zz*=-1}}
  else if(e.m==3){e.x-=v*.8*dt;e.vy+=900*dt;e.y+=e.vy*dt;if(e.y>=e.gy){e.y=e.gy;e.vy=0;if(Math.random()<dt*.9)e.vy=-rnd(560,700)}}
  else e.x-=v*dt;
  if(e.m==1)e.y=e.y0+Math.sin(e.t*2.5)*70;else if(e.m==2)e.y+=cl(P.y-e.y,-1,1)*70*dt;
  e.y=cl(e.y,20,H-20);
  if(e.x<W-50&&e.x>60&&(e.sh-=dt)<=0){e.sh=rnd(.7,1.4)*e.sc*(1.4-stage*.1);
   if(e.z==2){for(const g of[-.3,0,.3]){const a=Math.atan2(P.y-e.y,P.x-e.x)+g;EB.push({x:e.x,y:e.y,vx:Math.cos(a)*170,vy:Math.sin(a)*170})}}else aim(e.x,e.y,150+stage*20)}
  for(const b of B)e.hp-=bh(b,e,e.r+5*(b.s||1)+(b.big?20:0));
  if(e.hp<=0){e.d=1;score+=e.pt;boom(e.x,e.y,e.z*6+8,'#ffd');if(P.fv>0){}else if(yl<=0){yl=30;IT.push({x:e.x,y:e.y,k:'Y'})}else if(Math.random()<.1+e.z*.06)IT.push({x:e.x,y:e.y,k:Math.random()<.5?'O':'B'})}
  else if(hit(P,e,e.r+6)){e.d=1;boom(e.x,e.y,8,'#ffd');hurt()}}
 E=E.filter(e=>!e.d&&e.x>-40);
 for(const i of IT){i.x-=70*dt;if(hit(P,i,34)){i.d=1;msgT=1;if(i.k=='Y'){P.tri=10;msg='3方向ショット！'}else if(i.k=='O'){P.oc++;if(P.oc>=5){P.oc=0;P.fv=10;msg='フィーバー！10秒間無敵！';msgT=2}else msg='フィーバー '+P.oc+'/5'}else if(P.fv>0){msg='フィーバー中！'}else if(P.rl<5){P.rl++;msg='米粒 '+P.rl+'粒！'}else{P.rl=1;P.bar=3;P.wr++;if(P.wr>=2){P.big++;msg='バリア＋スマッシュゲット！'}else msg='バリア！ 米粒は1粒に戻る'}}}
 IT=IT.filter(i=>!i.d&&i.x>-20);
 for(const b of EB){b.x+=b.vx*dt;b.y+=b.vy*dt;for(const r of B)if(!r.d&&(r.big||b.f||b.mud||b.bc)&&hit(r,b,(b.r||12)+6*(r.s||1)+(r.big?40:0))){const hp=(b.hp==null?1:b.hp)-1;b.hp=hp;if(r.big||hp<=0)b.d=1;if(!r.big)r.d=1;break}if(!b.d&&hit(P,b,b.r||18)){b.d=1;hurt()}}
 EB=EB.filter(b=>!b.d&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
 if(stT>=LN()/2-5&&!mwd){mwd=1;E=[];EB=[];IT=[]}
 if(stT>=LN()/2&&!mbd&&!mb){mb={x:W+160,y:H/2,hp:180+stage*120,mx:180+stage*120,t:0,sh:1.2,dt:0};mbd=1;msg='中ボス！ 泥のかたまりがあらわれた！';msgT=3}
 if(mb){mb.t+=dt;
  if(mb.hp>0){mb.x+=(W-130-mb.x)*Math.min(1,dt*2);mb.y=H/2+Math.sin(mb.t*(1.3+stage*.2))*(120+stage*8);
   for(const b of B)mb.hp-=bh(b,mb,75+(b.big?40:0));
   if(hit(P,mb,80))hurt();
   if((mb.sh-=dt)<=0){mb.sh=Math.max(.5,1.3-stage*.2);mb.k=(mb.k||0)+1;if(mb.k%4==0){const m=8+stage*2;for(let i=0;i<m;i++){const g=mb.t+i*6.283/m;EB.push({x:mb.x-30,y:mb.y,vx:Math.cos(g)*170,vy:Math.sin(g)*170,mud:1})}}const n=2+(stage>>1),a=Math.atan2(P.y-mb.y,P.x-mb.x);for(let i=0;i<n;i++){const g=a+(i-(n-1)/2)*.3;EB.push({x:mb.x-60,y:mb.y,vx:Math.cos(g)*(220+stage*20),vy:Math.sin(g)*(220+stage*20),mud:1})}}
   if(mb.hp<=0){score+=1000;boom(mb.x,mb.y,40,'#fd5');IT.push({x:mb.x,y:mb.y-30,k:'Y'},{x:mb.x,y:mb.y+30,k:'B'});EB=[];msg='泥をやっつけた！';msgT=2}}
  else{mb.dt+=dt;if(Math.random()<dt*20)boom(mb.x+rnd(-50,50),mb.y+rnd(-40,60),8,'#fb5');if(mb.dt>1.6){boom(mb.x,mb.y+mb.dt*mb.dt*120,60,'#fd5');mb=null}}}
 if(stT>=LN()&&!boss&&!mb){const h=200+stage*160;E=[];EB=[];IT=[];boss={x:W+120,y:H/2,hp:h,mx:h,t:0,sh:.4,pc:0};msg='WARNING！ '+S[stage].n;msgT=3}
 if(boss){boss.t+=dt;if(boss.dead){boss.dt+=dt;if(Math.random()<dt*30)boom(boss.x+rnd(-60,60),boss.y+rnd(-60,60),12,pick(['#fd5','#f84','#fff']));if(boss.dt>1.6){boom(boss.x,boss.y,150,'#fd5');boom(boss.x,boss.y,60,'#fff');allies.push(S[stage].k);score+=2000;EB=[];E=[];boss=null;st=stage==4?'end':'clear';ct=0}}else{boss.x+=(W-110-boss.x)*Math.min(1,dt*2);boss.y=H/2+Math.sin(boss.t*(.8+stage*.3))*(stage==2?70:110+stage*8);
  bossHit();
  bossTouch();bossAtk(dt);
  boss.fn=(boss.fn==null?5:boss.fn)-dt;if(boss.fn<=0){boss.fn=10;const n=3+stage*2,a=Math.atan2(P.y-boss.y,P.x-boss.x);for(let i=0;i<n;i++){const g=a+(i-(n-1)/2)*.17,v=200+stage*15;EB.push({x:boss.x-50,y:boss.y,vx:Math.cos(g)*v,vy:Math.sin(g)*v,f:1})}}
  if(stage!=2&&(boss.sh-=dt)<=0){boss.sh=Math.max(.45,1.3-stage*.17);boss.pc++;
   if(boss.pc%2){const n=2+(stage+1>>1),a=Math.atan2(P.y-boss.y,P.x-boss.x);for(let i=0;i<n;i++){const g=a+(i-(n-1)/2)*.12;EB.push({x:boss.x-50,y:boss.y,vx:Math.cos(g)*(200+stage*15),vy:Math.sin(g)*(200+stage*15),f:1})}}
   else if(stage>0&&boss.pc%4==0){const n=8+stage*3;for(let i=0;i<n;i++){const g=boss.t+i*6.283/n;EB.push({x:boss.x-30,y:boss.y,vx:Math.cos(g)*150,vy:Math.sin(g)*150,f:1})}}else{const g=Math.random()*6|0;for(let i=0;i<8;i++)if(i!=g&&i!=g+1)EB.push({x:W+10,y:40+i*52,vx:-160,vy:0,f:1})}}
  if(boss.hp<=0){boss.dead=1;boss.dt=0;EB=[];E=[];boss.fk=null;boss.wn=0}}}
 B=B.filter(b=>!b.d&&b.x<W+20&&b.y>-20&&b.y<H+20);
}

let NF=0;function eyes(x,y,s){if(NF)return;X.fillStyle='#fff';for(const d of[-1,1]){X.beginPath();X.arc(x+d*s*.28,y,s*.17,0,7);X.fill()}
 X.fillStyle='#222';for(const d of[-1,1]){X.beginPath();X.arc(x+d*s*.28-s*.05,y,s*.08,0,7);X.fill()}}

function detail(k,s){
 const c=(f,px,py,rx,ry,a)=>{X.fillStyle=f;X.beginPath();X.ellipse(px*s,py*s,rx*s,ry*s,a||0,0,7);X.fill()};
 if(k=='wiener'){c('rgba(255,255,255,.45)',-.3,-.42,.25,.1,-.4);c('#2a1712',-.26,-.2,.07,.09);c('#2a1712',.26,-.2,.07,.09);X.strokeStyle='#2a1712';X.lineWidth=s*.04;X.beginPath();X.arc(0,-.1*s,.15*s,.2,2.9);X.stroke()}
 else if(k=='tamago'){c('rgba(190,110,10,.35)',-.5,-.25,.18,.12);c('rgba(190,110,10,.3)',.4,.3,.22,.12);c('rgba(255,255,255,.45)',-.35,-.45,.35,.07)}
 else if(k=='meat'){c('rgba(255,255,255,.4)',-.3,-.4,.25,.12,-.5);for(let i=0;i<5;i++)c('#4f8a2b',-.4+i*.2,.4+(i%2)*.1,.06,.035)}
 else if(k=='tomato'){c('rgba(255,255,255,.55)',-.35,-.35,.2,.11,-.6)}
 else{for(let i=0;i<7;i++)c('rgba(255,235,170,.5)',-.5+rr(i),-.5+rr(i+9),.12,.06,rr(i)*3);c('rgba(120,60,10,.35)',.3,.1,.12,.08)}}
function rd(r,c0,c1){const g=X.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);g.addColorStop(0,c0);g.addColorStop(1,c1);return g}
function real(k,s){
 const o=(f,px,py,rx,ry,a)=>{X.fillStyle=f;X.beginPath();X.ellipse(px*s,py*s,rx*s,ry*s,a||0,0,7);X.fill()};
 if(k=='wiener'){X.lineCap='round';

  X.fillStyle=rd(.7*s,'#f0714f','#a8271a');X.beginPath();X.ellipse(0,-.2*s,.68*s,.6*s,0,0,7);X.fill();
  o('rgba(255,255,255,.4)',-.28,-.45,.28,.1,-.5);o('rgba(80,10,5,.25)',0,.25,.55,.1)}
 else if(k=='tamago'){const g=X.createLinearGradient(0,-.6*s,0,.6*s);g.addColorStop(0,'#f9de63');g.addColorStop(1,'#e2a424');X.fillStyle=g;X.beginPath();X.roundRect(-.92*s,-.58*s,1.84*s,1.16*s,.2*s);X.fill();
  X.strokeStyle='rgba(176,110,20,.55)';X.lineWidth=s*.04;for(let i=-2;i<=2;i++){X.beginPath();for(let j=0;j<=12;j++){const x=-.85*s+j*.142*s,y=(i*.22+Math.sin(j*.9+i)*.02)*s;j?X.lineTo(x,y):X.moveTo(x,y)}X.stroke()}
  o('rgba(160,90,10,.5)',0,-.55,.88,.05);o('rgba(160,90,10,.5)',0,.55,.88,.05);for(let i=0;i<8;i++)o('#79a84a',-.7+rr(i+3)*1.4,-.45+rr(i+8)*.9,.04,.025,rr(i)*3);o('rgba(255,255,255,.3)',-.3,-.4,.5,.06)}
 else if(k=='meat'){X.fillStyle=rd(.85*s,'#a35a30','#3a1809');X.beginPath();X.arc(0,0,.85*s,0,7);X.fill();o('rgba(30,10,0,.55)',0,.55,.6,.2);
  for(let i=0;i<18;i++)o('#2a1006',(rr(i)-.5)*1.4,(rr(i+30)-.5)*1.4,.05,.03,rr(i)*3);for(let i=0;i<6;i++)o('#f1e3c0',(rr(i+60)-.5)*1.1,(rr(i+70)-.5)*.9,.05,.03,rr(i)*3);
  o('rgba(255,235,200,.55)',-.3,-.42,.26,.11,-.5);o('rgba(255,235,200,.25)',.35,-.1,.08,.18,.4)}
 else if(k=='tomato'){X.fillStyle=rd(.85*s,'#ff6a50','#b8140a');X.beginPath();X.ellipse(0,.05*s,.85*s,.8*s,0,0,7);X.fill();o('rgba(255,255,255,.55)',-.35,-.35,.2,.1,-.6);
